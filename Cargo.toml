[package]
name = "iodeser"
version = "0.6.0"
authors = ["Io-Maciek"]
description = "Crate that allows to read from and write to .io file format."
keywords = ["io", "file-format", "serialization", "deserialization"]
edition = "2021"
repository = "https://github.com/IoDeSer/rust-library"
readme = "README.md"
license="MIT"

[lib]

[dependencies]
io_deser = { version = "0.6.0" }#path="./io_deser", 
pastey = "0.2.2"
array-init = "2.1.0"
chrono = {version = "0.4.44", optional = true}
serde = {version="1.0.228", optional = true, features = ["derive"]}